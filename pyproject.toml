[project]
name = "mmm-tool"
version = "0.1.0"
description = "Meridian MMM tool: pipeline phases A-E and screens F-I"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "charset-normalizer>=3.0",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "mmm-tool[ui]"]

[project.scripts]
mmm-ingest = "mmm_tool.ingest.cli:main"
mmm-ui = "mmm_tool.api.app:main"

[tool.setuptools.packages.find]
include = ["mmm_tool*"]

[tool.setuptools.package-data]
mmm_tool = ["web/*.html", "ingest/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
