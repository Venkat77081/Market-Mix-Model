# Phase B thresholds. These are judgment calls, not facts about any file:
# change them here, not in the code.

media_gaps:
  # A spend or exposure column with no literal zeros whose blanks cover at
  # least this share of its active weeks writes "no spend" as a blank:
  # its blanks are suggested as 0 (and asked). Below it, blanks in that
  # column are missing values and are interpolated.
  blank_as_zero_share: 0.2

zero_runs:
  # A paid channel with spend in at least this share of its active weeks
  # (between its first and last value) is "always on"; a run of real zeros
  # this many weeks or longer in it is flagged, and the user confirms it
  # as a real pause (kept as 0, the default) or a data gap (interpolated).
  always_on_share: 0.8
  min_run_weeks: 2

jumps:
  # A level (index, price, rate) this many times the week before, or an
  # amount (spend, exposure) this many times both neighbouring weeks.
  ratio: 10
  # "10x" in practice: a value multiplied by 10 rarely lands exactly on 10.0x.
  near: 0.9

level_shift:
  # A money column whose level changes by close to a power of 10 at one
  # week (lakhs before, rupees after) is offered a conversion.
  min_weeks: 8          # weeks on each side of the change
  tolerance: 0.15       # largest distance from a whole power of 10, in log10 units
  min_power: 1          # 10x or more

short_weeks:
  # Daily data: a week with fewer days than this (inside the period) is incomplete.
  full_days: 7

multi_row_weeks:
  # Step 8: rows that share a date (and region) are judged against a normal
  # week: the median of each spend and KPI column over this many single-row
  # weeks on each side, same region.
  neighbours: 4
  # Rows adding up to a normal week (within this share) are a split; each
  # row being a normal week is a likely revision.
  tolerance: 0.30
  # Values equal after rounding to this many significant digits are the same
  # (exact copies, and columns repeated on split rows).
  significant_digits: 6
