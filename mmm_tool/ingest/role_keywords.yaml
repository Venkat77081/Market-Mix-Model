# Built-in words the tool uses to suggest a role for each column (step 3).
#
# Don't edit this file to add your own words: put them in roles.yaml at the
# project root (or the file named by MMM_ROLES_FILE). Your rules are checked
# before these, and your aliases and words are added to these.
#
# How a column name is matched: it is lowercased and split into words on
# "_", "-", spaces and camelCase, so "TV_Spend (₹)" reads as "tv spend".
# An entry matches when it appears as whole words, so "pop" matches
# "adult pop" but not "popular". An entry can be a phrase: "per policy".
#
# Rules are checked top to bottom; the first one that matches wins. Fields:
#   role        one of: geo, population, kpi, revenue_per_kpi, revenue_for_kpi, media,
#               media_spend, reach, frequency, rf_spend, control, non_media_treatment,
#               organic_media, excluded
#   words       the name must contain at least one of these
#   also_needs  ...and at least one of these (optional)
#   unless      ...and none of these (optional)
#   confidence  high, medium or low (default medium)
#   reason      shown to the user in the "Why" column

rules:
  - role: population
    words: [population, pop, households, adult pop]
    confidence: high
    reason: population by name

  - role: excluded
    words: [brand, branded]
    also_needs: [search, queries, query, volume, clicks, traffic]
    unless: [spend, spends, cost, costs, investment, budget]
    reason: branded search rises because of other marketing; modelling it would steal their credit

  - role: revenue_per_kpi
    words: [revenue per, per policy, per kpi, per unit, avg premium, average premium, avg ticket, aov, arpu]
    unless: [index, idx]   # avg_premium_index is a price index, not ₹ per policy
    confidence: high
    reason: value of one KPI unit

  - role: reach
    words: [reach]
    confidence: high
    reason: reach by name

  - role: frequency
    words: [frequency, freq]
    confidence: high
    reason: frequency by name

  - role: organic_media
    words: [email, emails, whatsapp, sms, push, newsletter, organic, owned, seo, crm]
    unless: [spend, spends, cost, costs, investment, budget]
    reason: unpaid channel by name

  - role: non_media_treatment
    words: [discount, discounts, promo, promotion, offer, cashback, incentive, incentives, commission]
    reason: a lever you control that isn't media

  - role: control
    words: [index, idx, competitor, competition, sov, share of voice]
    confidence: high
    reason: outside factor by name

  - role: control
    words: [price, rate, registrations, registration, holiday, season, festive, diwali, flag, temperature,
            cpi, inflation, gdp, unemployment, event, covid, lockdown, trend]
    reason: outside factor by name

  - role: media_spend
    words: [spend, spends, cost, costs, investment, budget, outlay, ads, ad, advertising]
    confidence: high
    reason: spend by name

  # Fees and payouts usually go to a media partner (an aggregator, affiliates),
  # but not always, so they are suggested with low confidence for you to confirm.
  - role: media_spend
    words: [fees, fee, payout, payouts]
    confidence: low
    reason: fees and payouts are usually paid to a media partner; confirm this is paid media

  - role: media
    words: [grp, grps, trp, trps, impression, impressions, impr, imps, click, clicks, view, views, insertions, spots]
    confidence: high
    reason: exposure metric by name

  - role: kpi
    words: [kpi, policies, policy count, conversion, conversions, lead, leads, application, applications,
            quote, quotes, quote requests, enquiry, enquiries, inquiry, inquiries, requests,
            order, orders, unit, units, signups, sign ups, acquisition, acquisitions, customers, quotes]
    confidence: high
    reason: count of outcomes by name

  - role: kpi
    # Money and outcome words. ₹ in a column name reads as "inr". After the KPI is
    # chosen, step 3 checks these columns by value: one that is a near-constant
    # multiple of the KPI becomes "Revenue for KPI" (premium = policies x price).
    words: [revenue, sales, gwp, nbp, premium, gross written, gross written premium, premium income, total premium,
            gmv, turnover, bookings, inr, rs, value]
    reason: money outcome by name

  # Only text columns are checked against geo rules; a text column with a
  # few repeating values is suggested as the region even without these words.
  - role: geo
    words: [geo, region, state, zone, dma, market, territory, city, province, area, cluster]
    confidence: high
    reason: region by name

# Words dropped from a column name to find its channel: "tv_spend" and
# "tv_grps" both belong to channel "tv", so step 4 pairs them.
channel_words_to_strip: [
  spend, spends, cost, costs, investment, inr, rs, cr, lakh, lakhs, amount,
  grp, grps, trp, trps, impressions, impression, impr, imps, clicks, click,
  views, view, reach, frequency, freq, rf, sends, send, opens, posts,
  media, paid, weekly, total, ads, ad, advertising, fees, fee, payout, payouts,
]

# Different names for the same channel, after the words above are dropped.
channel_aliases:
  yt: youtube
  fb: facebook
  sem: search
  paid search: search
  dooh: outdoor
  ooh: outdoor

# Step 5: is the KPI a count (non-revenue) or money (revenue)? Count words
# are checked first.
kpi_count_words: [policies, policy, count, conversions, leads, applications, orders, units, customers, quote, quotes,
                  requests, enquiries, inquiries, signups]
kpi_money_words: [revenue, sales value, value, premium, gwp, gmv, turnover, amount, inr, rs, bookings, income]

# Phase B (steps 8 and 9): how a control or non-media column is combined when
# duplicate weeks collapse, regions add up to national, or days become weeks.
# Spend, exposure and the KPI are always summed; 0/1 flags always take the
# maximum. Other columns are averaged if their name has a mean word, summed
# if it has a sum word, and otherwise you are asked.
aggregation_mean_words: [index, price, rate, pct, percent, percentage, share, ratio, avg, average, mean,
                         temperature, temp, cpi, inflation, gdp, unemployment, score, rating, discount]
aggregation_sum_words: [spend, spends, cost, costs, registrations, registration, count, volume, sends,
                        sales, units, orders, visits, sessions, calls, leads, amount, incentive, incentives]

# Phase B (step 13): unit words in money column names, and the ₹ each unit is worth.
money_units:
  crore: 10000000
  crores: 10000000
  cr: 10000000
  lakh: 100000
  lakhs: 100000
  lac: 100000
  lacs: 100000
  mn: 1000000
  million: 1000000
  thousand: 1000

# Step 1: a trailing row whose label is one of these is a summary (TOTAL), not data.
summary_row_words: [total, grand total, sub total, subtotal, sum, totals, average, avg, mean]

# Unit words allowed after a number in a cell: "₹1.17 Cr", "12.6 L", "45k".
value_units:
  cr: 10000000
  crore: 10000000
  crores: 10000000
  l: 100000
  lakh: 100000
  lakhs: 100000
  lac: 100000
  lacs: 100000
  k: 1000
  thousand: 1000
  mn: 1000000
  million: 1000000
